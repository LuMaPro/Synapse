<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: a tela da sessão ocupa o celular inteiro, respeitando o
         entalhe e a barra de gestos pelos env(safe-area-inset-*) do CSS (issue #35). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Instalação como app (issue #35) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0D1A" />
    <meta name="description" content="Cada minuto de foco vira uma conexão." />
    <!-- iPhone: o Safari usa estes em vez do manifest para "Adicionar à Tela de Início" -->
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Synapse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Fontes da identidade visual (docs/design/README.md) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Synapse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
