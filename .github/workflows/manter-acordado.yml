# Mantém a API acordada (issue #38). No plano gratuito do Render, o serviço dorme
# depois de 15 minutos sem requisições, e a primeira requisição depois disso demora
# cerca de 1 minuto. Este workflow chama o /health a cada 10 minutos, das 7h à meia-noite
# (horário de Brasília), e também pode ser disparado à mão pela aba Actions.
#
# O endereço da API fica na variável de repositório API_URL
# (Settings > Secrets and variables > Actions > Variables).
name: Manter a API acordada

on:
  schedule:
    - cron: "*/10 10-23,0-2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chama o health check
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "A variável API_URL não está definida; nada a fazer."
            exit 0
          fi
          # Se a API estiver dormindo, a primeira resposta demora; por isso o tempo
          # limite longo e as novas tentativas.
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 \
            "$API_URL/health"
